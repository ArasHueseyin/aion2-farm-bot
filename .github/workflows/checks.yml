name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test, build and smoke test
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Aion2Farm-windows-x64
          path: |
            dist/Aion2Farm.exe
            dist/Aion2FarmMCP.exe
            dist/SHA256SUMS.txt
            dist/smoke-test.json
